name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install qpdf
        run: sudo apt-get update && sudo apt-get install -y qpdf fonts-urw-base35
      - run: bun install --frozen-lockfile
      - name: Install Chromium for the browser tests
        run: bunx playwright-core install --with-deps chromium
      - run: bun run typecheck
      - name: Bundle-size budget (browser entry <= 50 KB minified)
        run: bun run size
      - run: bun test
      - run: bun run build

  browsers:
    # The browser tests (rendering, compression end to end, the codec, the website) in the other engines.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install qpdf
        run: sudo apt-get update && sudo apt-get install -y qpdf fonts-urw-base35
      - run: bun install --frozen-lockfile
      - name: Install ${{ matrix.browser }}
        run: bunx playwright-core install --with-deps ${{ matrix.browser }}
      - name: Browser tests in ${{ matrix.browser }}
        run: bun test test/browser test/contract/browser.test.ts
        env:
          BROWSER: ${{ matrix.browser }}

  node:
    # The published build must run on plain Node, not just Bun.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install qpdf
        run: sudo apt-get update && sudo apt-get install -y qpdf fonts-urw-base35
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Compress a generated PDF with the built CLI under Node ${{ matrix.node }}
        run: |
          bun scripts/smoke-fixture.ts smoke.pdf
          node dist/cli.js compress smoke.pdf smoke.out.pdf
          qpdf --check smoke.out.pdf
