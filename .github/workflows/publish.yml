name: Publish to npm

# Publishes when a GitHub release is published (tag vX.Y.Z matching package.json), or manually.
#
# Authentication, either:
# - an NPM_TOKEN repository secret (a granular npm token with read and write access); needed for
#   the very first publish, because npm can only attach a trusted publisher to an existing package;
# - or npm trusted publishing (OIDC): on npmjs.com, package settings -> Trusted publisher ->
#   GitHub Actions, repository benmerckx/leanpdf, workflow publish.yml. Then delete NPM_TOKEN.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run npm publish --dry-run
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install qpdf
        run: sudo apt-get update && sudo apt-get install -y qpdf
      - name: Use npm >= 11.5 (trusted publishing)
        run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - name: Install Chromium for the browser tests
        run: bunx playwright-core install --with-deps chromium
      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: bun run typecheck
      - run: bun run size
      - run: bun test
      - run: bun run build
      - name: Publish
        run: npm publish --provenance --access public ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
