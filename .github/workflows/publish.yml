name: Publish to npm

# Publishes when a version tag is pushed (vX.Y.Z, matching package.json), then creates the GitHub
# release for it, with the annotated tag's message as the notes. Can also be run by hand, as a dry
# run by default.
#
#   npm version 0.3.0 --no-git-tag-version   # or edit package.json
#   git commit -am "Release 0.3.0" && git tag -a v0.3.0 -m "<release notes>" && git push --follow-tags
#
# Authentication is npm trusted publishing (OIDC): on npmjs.com, package settings -> Trusted
# publisher -> GitHub Actions, repository alineacms/leanpdf, workflow publish.yml. No token needed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run npm publish --dry-run
        type: boolean
        default: true

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install qpdf
        run: sudo apt-get update && sudo apt-get install -y qpdf
      - name: Use npm >= 11.5 (trusted publishing)
        run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - name: Install Chromium for the browser tests
        run: bunx playwright-core install --with-deps chromium
      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: bun run typecheck
      - run: bun run size
      - run: bun test
      - run: bun run build
      - name: Publish
        run: npm publish --provenance --access public ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && '--dry-run' || '' }}
      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        # Skipped when the release already exists (e.g. it was created in the GitHub UI, which
        # also pushes the tag).
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
